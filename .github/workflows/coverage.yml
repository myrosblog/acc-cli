name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs when new commits land on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Collect coverage and upload to Codecov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests with coverage
        run: npm run coverage

      # Only merged code reaches Codecov. The coverage badge in README.md
      # reads the default branch, so pull request commits must not be sent.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Never turn main red on a Codecov outage: the c8 thresholds in
          # package.json are the gate, this upload only publishes the report
          fail_ci_if_error: false
          skip_validation: true # bypass GPG validation @since 2026-06-08
