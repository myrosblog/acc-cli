name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs when new commits land on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # The command reference in README.md is generated from the oclif commands.
      # Regenerate it and fail if the committed copy differs (fix: npm run readme).
      - name: Check README command reference is up to date
        run: |
          npm run readme
          git diff --exit-code README.md

  test:
    name: Tests (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every failing cell, not just the first one
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm test

      # Starts the binary as a smoke test
      - name: Smoke test the CLI
        shell: bash
        run: |
          node bin/acc --version
          node bin/acc --help
          node bin/acc auth --help
          node bin/acc instance --help
          node bin/acc monitor --help
          node bin/acc config --help
