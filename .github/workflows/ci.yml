name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs when new commits land on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keeps CI runs out of the usage data, see AccTelemetry
env:
  AIO_TELEMETRY_DISABLED: "true"

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, to list the commits of the pull request
          fetch-depth: 0

      # The local hook is skipped by --no-verify or a missing npm install.
      # Merge commits land on main as is, so each commit is checked.
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message_file=$(mktemp)
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$message_file"
            sh .githooks/commit-msg "$message_file" || status=1
          done
          exit $status

  quality:
    name: "Quality: prettier, lint, readme, aio-cli dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check aio-cli dependencies
        run: npm run check:aio-dependencies

      # The command reference in README.md is generated from the oclif commands.
      # Regenerate it and fail if the committed copy differs (fix: npm run readme).
      - name: Check README command reference is up to date
        run: |
          npm run readme
          git diff --exit-code README.md

  test:
    name: Tests (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every failing cell, not just the first one
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm test

      # Installs the npm tarball as users do (npm i -g), so a file missing from
      # "files" or a devDependency used at runtime fails here
      - name: Install the packed CLI
        shell: bash
        run: |
          tarball=$(npm pack --silent)
          npm install --global "./$tarball"

      - name: Smoke test the installed CLI
        shell: bash
        run: |
          acc --version
          acc --help
          acc auth --help
          acc instance --help
          acc monitor --help
          acc config --help
          acc telemetry --help
